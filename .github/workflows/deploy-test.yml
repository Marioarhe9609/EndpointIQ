name: Deploy to Pruebas (TEST/QA)

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: read
  id-token: write
  security-events: write # Para registrar reportes de seguridad en GitHub si aplica

env:
  PROJECT_ID: proy-anla-poc
  GAR_LOCATION: us-central1
  REPOSITORY: onyx-server-repo
  SERVICE: onyx-server-test
  REGION: us-central1
  WORKLOAD_IDENTITY_PROVIDER: projects/631753912632/locations/global/workloadIdentityPools/onyx-github-pool/providers/onyx-github-provider
  SERVICE_ACCOUNT: onyx-github-sa@proy-anla-poc.iam.gserviceaccount.com

jobs:
  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-with-dependencies: '3.11'
          python-version: '3.11'

      - name: Run pip-audit (SCA)
        run: |
          pip install pip-audit
          # Ejecutar pip-audit en las dependencias estándar del sistema (google-cloud-bigquery)
          pip-audit || true # No bloquea en este demo si hay falsos positivos, pero audita en consola

      - name: Build Local Image for Scanning
        run: |
          docker build -t onyx-server:scan .

      - name: Run Trivy Vulnerability Scanner (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'onyx-server:scan'
          format: 'table'
          exit-code: '0' # Cambiar a '1' en producción para fallar el pipeline ante vulnerabilidades CRÍTICAS
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Build & Deploy TEST
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Google Auth (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/onyx-server:test-${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          # Etiquetar también como 'test-latest'
          docker tag $IMAGE_TAG "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/onyx-server:test-latest"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/onyx-server:test-latest"

      - name: Deploy to Google Cloud Run (TEST)
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/onyx-server:test-latest
          env_vars: |
            BQ_DATASET=onyx_test
            PORT=8080
